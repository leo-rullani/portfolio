<nav
  class="menu-system"
  [attr.aria-label]="text[activeLang].primaryNavigation"
>
  <div class="menu-bg" aria-hidden="true"></div>
  <div class="shadow-menu" aria-hidden="true"></div>

  <button
    class="logo"
    type="button"
    [attr.aria-label]="text[activeLang].home"
    (click)="scrollToProfile()"
  >
    <img src="/assets/img/profil.png" alt="" />
  </button>

  <div class="menu-items" *ngIf="!hideLinks()">
    <button
      type="button"
      aria-controls="about-me-slide"
      [class.active]="activeLink === 'aboutMe'"
      (click)="scrollToAboutMe()"
    >
      {{ text[activeLang].navWhyMe }}
    </button>
    <button
      type="button"
      aria-controls="skill-set-slide"
      [class.active]="activeLink === 'skills'"
      (click)="scrollToSkills()"
    >
      {{ text[activeLang].navSkills }}
    </button>
    <button
      type="button"
      aria-controls="my-work-slide"
      [class.active]="activeLink === 'myWork'"
      (click)="scrollToMyWork()"
    >
      {{ text[activeLang].navMyWork }}
    </button>
    <button
      type="button"
      aria-controls="career-profile-slide"
      [class.active]="activeLink === 'cv'"
      (click)="scrollToCareer()"
    >
      {{ text[activeLang].navCv }}
    </button>
    <button
      type="button"
      aria-controls="contact-me-slide"
      [class.active]="activeLink === 'contact'"
      (click)="scrollToContact()"
    >
      {{ text[activeLang].navContact }}
    </button>
  </div>

  <button
    class="burger-menu"
    type="button"
    *ngIf="!hideLinks()"
    aria-controls="mobile-navigation-menu"
    [attr.aria-expanded]="isOverlayOpen"
    [attr.aria-label]="isOverlayOpen ? text[activeLang].closeMenu : text[activeLang].openMenu"
    (click)="toggleMenu()"
  >
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </button>
</nav>

<nav
  id="mobile-navigation-menu"
  class="mobile-overlay"
  [ngClass]="{'show': isOverlayOpen}"
  *ngIf="isOverlayOpen"
  [attr.aria-label]="text[activeLang].mobileNavigation"
>
  <div class="overlay-bg" aria-hidden="true"></div>

  <button
    class="close-btn"
    type="button"
    [attr.aria-label]="text[activeLang].closeMenu"
    (click)="toggleMenu()"
  >
    <div class="line1"></div>
    <div class="line2"></div>
  </button>

  <div class="menu-items-column">
    <ng-container *ngIf="!hideLinks()">
      <button
        type="button"
        aria-controls="about-me-slide"
        [class.active]="activeLink === 'aboutMe'"
        (click)="onWhyMe()"
      >
        {{ text[activeLang].navWhyMe }}
      </button>
      <button
        type="button"
        aria-controls="skill-set-slide"
        [class.active]="activeLink === 'skills'"
        (click)="onSkillSet()"
      >
        {{ text[activeLang].mobileSkillSet }}
      </button>
      <button
        type="button"
        aria-controls="my-work-slide"
        [class.active]="activeLink === 'myWork'"
        (click)="onMyWork()"
      >
        {{ text[activeLang].mobileMyWork }}
      </button>
      <button
        type="button"
        aria-controls="career-profile-slide"
        [class.active]="activeLink === 'cv'"
        (click)="onCareer()"
      >
        {{ text[activeLang].navCv }}
      </button>
      <button
        type="button"
        aria-controls="contact-me-slide"
        [class.active]="activeLink === 'contact'"
        (click)="onContact()"
      >
        {{ text[activeLang].mobileContact }}
      </button>
    </ng-container>

    <label class="language-picker">
      <span class="language-picker__value" aria-hidden="true">
        <strong>{{ activeLanguageShortCode }}</strong>
        <span>{{ activeLanguageName }}</span>
      </span>
      <svg class="language-picker__chevron" aria-hidden="true" viewBox="0 0 12 8">
        <path d="m1 1.5 5 5 5-5" />
      </svg>
      <select
        [value]="activeLang"
        [attr.aria-label]="text[activeLang].chooseLanguage"
        (change)="onLanguageSelection($event)"
      >
        @for (language of languageOptions; track language.code) {
          <option [value]="language.code" [attr.lang]="language.htmlLang">
            {{ language.name }}
          </option>
        }
      </select>
    </label>
  </div>
</nav>
