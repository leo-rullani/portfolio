<section class="skills-shell" aria-labelledby="skills-heading">
  <header>
    <span class="eyebrow">{{ copy[activeLang].eyebrow }}</span>
    <h2 id="skills-heading">{{ copy[activeLang].title }}</h2>
    <p>{{ copy[activeLang].intro }}</p>
  </header>
  <div class="skill-groups">
    <section class="skill-group" *ngFor="let group of groups">
      <h3>{{ group.title[activeLang] }}</h3>
      <div class="skills-grid">
        <div class="skill" *ngFor="let skill of group.skills">
          <span class="icon-frame">
            <img *ngIf="skill.icon" [src]="'assets/icons/skills/' + skill.icon + '.svg'" [alt]="skill.name + ' logo'">
            <span *ngIf="skill.symbol" class="symbol" aria-hidden="true">{{ skill.symbol }}</span>
          </span>
          <span>{{ skill.name }}</span>
        </div>
      </div>
    </section>
  </div>
  <div class="skills-footer"><button type="button" (click)="scrollToContact()">{{ copy[activeLang].talk }}</button><button class="arrow" type="button" (click)="scrollNext()" aria-label="Next section"><span></span></button></div>
</section>
